# Minimal SearxNG settings for a LOCAL, single-user research instance.
#
# `json` is the only reason this file exists at all: SearxNG serves HTML only by
# default, and `SearxSearcher` needs the JSON format. Without it the search
# endpoint returns a body with no `results` key, which is why the searcher
# raises SearchUnavailable naming this setting rather than reporting "found
# nothing" (L-046).
#
# The secret key comes from the SEARXNG_SECRET environment variable set in
# docker-compose.yml. Bound to 127.0.0.1 only; nothing here is reachable off
# this machine.

# ---------------------------------------------------------------------------
# THE ENGINE LIST, AND THE BUG THAT MADE EVERY SEARCH FAIL
# ---------------------------------------------------------------------------
#
# This file used to say `use_default_settings: true` and then list four engines
# with `disabled: false`, believing that restricted search to those four. **It
# does not.** Under `use_default_settings: true` a top-level `engines:` list is
# MERGED with the defaults by name: listed entries update the defaults, and
# every other default engine stays enabled.
#
# Measured against the running container: **84 engines were enabled**, including
# `brave`, `duckduckgo`, `google cse` and `startpage` -- the exact four the old
# comment claimed had been disabled. Every query fanned out to all of them, so
# the CAPTCHAs and 403s in the logs were not bad luck, they were guaranteed.
#
# Worse, two of the four names it listed -- `marginalia` and `stract` -- **do
# not exist in this image at all**, and SearxNG ignores unknown engine names
# silently. So the config enabled 84 engines and failed to enable half of the
# handful it wanted.
#
# `keep_only` is the setting that actually restricts the list.
use_default_settings:
  engines:
    keep_only:
      # Small independent indexes that tolerate a low-volume metasearch. mwmbl
      # is the one that earns its place: it is the only engine that reached
      # "Hanging Piece - Chess Terms - Chess.com", which is exactly the genre
      # the knowledge base needs (E63).
      - mojeek
      - mwmbl
      - crowdview
      # Measured and REMOVED: `yep` and `fireball` were unresponsive on every
      # motif query tried, so they cost a request each and a timeout wait, and
      # returned nothing. An engine that never answers is worse than an engine
      # that is absent, because SearxNG reports it as unresponsive and the
      # searcher treats a fully unresponsive result set as "could not ask".
      # Encyclopaedic and definition-shaped, which is what a motif entry is.
      - encyclosearch
      - ddg definitions
      - curlie
      # Keyless and reliable. `wikipedia` contributes almost nothing in practice
      # -- its engine answers on near-exact titles rather than questions -- but
      # it costs one cheap request and occasionally lands the right article.
      - wikipedia
      - wikibooks
      # Deliberately ABSENT: google, google cse, duckduckgo, startpage, brave.
      # Measured over a day, those four CAPTCHA or 403 a metasearch container,
      # after which every query returns empty and the swarm reports an empty
      # web. They are the reason the fan-out looked like the problem.

# `keep_only` decides which engines survive; this decides how they behave.
# `mwmbl` and `wikibooks` ship disabled by default, so keeping them is not
# enough -- they have to be switched on as well.
# `keep_only` decides which engines survive; this decides how they behave. Most
# of these ship disabled, so keeping them is not enough -- they have to be
# switched on as well. An unknown name here is ignored silently, which is how
# the previous config believed it had enabled `marginalia` and `stract`.
engines:
  - name: mojeek
    disabled: false
  - name: mwmbl
    disabled: false
  - name: crowdview
    disabled: false
  - name: encyclosearch
    disabled: false
  - name: ddg definitions
    disabled: false
  - name: curlie
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikibooks
    disabled: false

server:
  # A rate limiter aimed at abusive public traffic, which one researcher on
  # localhost is not. Left off so a 16-opening run is not throttled into
  # looking like an absence of results.
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  # Politeness toward the upstream engines SearxNG queries on our behalf.
  autocomplete: ""
  default_lang: "en"

outgoing:
  # One request at a time to any upstream, with a real gap between them. The
  # client already paces itself (`SearxSearcher.SPACING = 6.0`), but that paces
  # OUR queries -- it says nothing about how many upstream requests each of them
  # becomes. With the fan-out cut from 84 engines to 4 this is now a small
  # number rather than a burst.
  # mwmbl's API is slow: it timed out repeatedly at 10 s and answered fine at
  # 20 s. A timeout is reported as an unresponsive engine, which SearxSearcher
  # correctly raises on -- so a timeout too low turns a working index into
  # "the web has nothing", which is the L-046 shape this project keeps hitting.
  request_timeout: 20.0
  max_request_timeout: 30.0
  pool_connections: 4
  pool_maxsize: 4

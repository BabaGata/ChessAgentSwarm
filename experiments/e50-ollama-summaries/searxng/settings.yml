# Minimal SearxNG settings for a LOCAL, single-user research instance.
#
# `json` is the only reason this file exists at all: SearxNG serves HTML only by
# default, and `SearxSearcher` needs the JSON format. Without it the search
# endpoint returns a body with no `results` key, which is why the searcher
# raises SearchUnavailable naming this setting rather than reporting "found
# nothing" (L-046).
#
# The secret key comes from the SEARXNG_SECRET environment variable set in
# docker-compose.yml. Bound to 127.0.0.1 only; nothing here is reachable off
# this machine.
use_default_settings: true

server:
  # A rate limiter aimed at abusive public traffic, which one researcher on
  # localhost is not. Left off so a 16-opening run is not throttled into
  # looking like an absence of results.
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  # Politeness toward the upstream engines SearxNG queries on our behalf.
  autocomplete: ""
  default_lang: "en"

# The big four throttle a single researcher hard: measured over one day, brave
# and google cse return "too many requests" and duckduckgo and startpage return
# CAPTCHA, after which every query comes back empty and the swarm reports an
# empty web (L-046 again, which is why SearxSearcher now raises on it).
#
# These four are smaller indexes that do not rate-limit at this volume. They are
# a worse index and an available one, and an available worse index is what makes
# the difference between a swarm that runs and a swarm that cannot.
engines:
  - name: mojeek
    disabled: false
  - name: marginalia
    disabled: false
  - name: stract
    disabled: false
  - name: wikipedia
    disabled: false
